<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@600;800&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0: #04020c;
    --ink: #e8ecff;
    --ink-dim: #8a93c4;
    --glass: rgba(12, 15, 46, 0.86);
    --glass-solid: rgba(12, 14, 40, 0.96);
    --glass-edge: rgba(120, 200, 255, 0.22);
    --dep: #4ff3ff;
    --user: #ff5fd2;
    --accent: #ffe14f;
    --good: #7dff6a;
    --bad: #ff5f6d;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --display: "Chakra Petch", "JetBrains Mono", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg0); color: var(--ink); font-family: var(--mono); }
  button { font-family: inherit; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #gl { pointer-events: none; }
  canvas.dragging { cursor: grabbing; }
  canvas.hovering { cursor: pointer; }

  header {
    position: fixed; top: 0; left: 0; right: 0; padding: 14px 18px; z-index: 5;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; pointer-events: none;
  }
  header > * { pointer-events: auto; }
  h1 {
    margin: 0; font-family: Orbitron, var(--mono); font-weight: 800; font-size: 20px; letter-spacing: 0.18em;
    background: linear-gradient(90deg, #ff5fd2, #ffe14f, #4ff3ff); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 10px rgba(255, 95, 210, 0.45));
  }
  .stats { font-size: 11px; color: var(--ink-dim); letter-spacing: 0.04em; }

  .repo-wrap { position: relative; }
  .repo {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; max-width: 320px;
    font: 700 14px var(--display); padding: 6px 12px; border-radius: 10px;
    background: var(--glass); border: 1px solid rgba(255, 95, 210, 0.45);
  }
  .repo:hover { border-color: var(--user); }
  .repo .rdot { width: 8px; height: 8px; border-radius: 50%; background: var(--user); box-shadow: 0 0 8px var(--user); flex: none; }
  .repo #repoName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .repo .caret { color: var(--ink-dim); font-size: 10px; }
  .pop {
    position: absolute; top: 42px; left: 0; width: 380px; max-width: calc(100vw - 32px); padding: 14px;
    background: var(--glass-solid); border: 1px solid var(--glass-edge); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  /* repository choices (shared by the header menu and the welcome screen) */
  .choices { display: flex; flex-direction: column; gap: 10px; text-align: left; }
  .primary {
    all: unset; cursor: pointer; text-align: center; padding: 10px 16px; border-radius: 10px; font: 700 14px var(--display);
    color: #0a0820; background: linear-gradient(90deg, #ff5fd2, #b98bff 55%, #4ff3ff); box-shadow: 0 0 24px rgba(255, 95, 210, 0.3);
  }
  .primary:hover { filter: brightness(1.1); }
  .pathform { display: flex; gap: 6px; }
  .pathform input {
    flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--glass-edge);
    background: rgba(0,0,0,0.35); color: var(--ink); font: 12px var(--mono); outline: none;
  }
  .pathform input:focus { border-color: var(--dep); }
  .ghost {
    all: unset; cursor: pointer; padding: 7px 12px; border-radius: 8px; font-size: 12px; color: var(--ink);
    border: 1px solid var(--glass-edge); background: rgba(255,255,255,0.04);
  }
  .ghost:hover { border-color: var(--dep); }
  .ghost:disabled { opacity: 0.4; cursor: default; }
  .choices h4 { margin: 6px 0 0; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); font-weight: 400; }
  .recent { display: flex; flex-direction: column; gap: 2px; max-height: 260px; overflow: auto; }
  .recent button {
    all: unset; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 0 10px; padding: 7px 10px; border-radius: 8px;
  }
  .recent button:hover { background: rgba(79, 243, 255, 0.1); }
  .recent b { font: 700 13px var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent small { grid-column: 1; font-size: 10px; color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent span { grid-column: 2; grid-row: 1 / 3; align-self: center; font-size: 10px; color: var(--ink-dim); text-align: right; }

  .search { position: relative; margin-left: auto; }
  .search input {
    width: 230px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--glass-edge);
    background: var(--glass); color: var(--ink); font: 12px var(--mono); outline: none;
  }
  .search input:focus { border-color: var(--dep); box-shadow: 0 0 0 3px rgba(79, 243, 255, 0.15); }
  .results {
    position: absolute; top: 38px; right: 0; width: 320px; max-height: 50vh; overflow: auto;
    background: var(--glass-solid); border: 1px solid var(--glass-edge); border-radius: 12px; display: none; padding: 4px;
  }
  .results.open { display: block; }
  .results button { all: unset; display: flex; gap: 8px; align-items: center; width: 100%; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; box-sizing: border-box; }
  .results button:hover, .results button.active { background: rgba(79, 243, 255, 0.12); }

  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; }
  .tbtn {
    all: unset; cursor: pointer; font-size: 11px; padding: 7px 11px; border-radius: 999px;
    border: 1px solid var(--glass-edge); background: var(--glass); color: var(--ink-dim);
  }
  .tbtn[aria-pressed="true"] { color: var(--bg0); background: var(--dep); border-color: var(--dep); }
  .tbtn.update { color: var(--accent); border-color: rgba(255, 225, 79, 0.4); }
  .tbtn.update .spin { display: inline-block; }
  .tbtn.busy .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sliders {
    display: flex; gap: 14px; align-items: center; padding: 5px 14px; border-radius: 999px;
    border: 1px solid var(--glass-edge); background: var(--glass);
  }
  .sliders label { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-dim); cursor: pointer; }
  .sliders output { min-width: 34px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .sliders input[type="range"] { width: 90px; accent-color: var(--dep); cursor: pointer; margin: 0; }

  .legend {
    position: fixed; left: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2;
    max-width: min(620px, calc(100vw - 32px)); max-height: 28vh; overflow: auto;
  }
  .chip {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; padding: 5px 10px;
    border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-edge);
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 8px currentColor; flex: none; }
  .chip.off { opacity: 0.35; }
  .chip small { color: var(--ink-dim); }

  .hint { position: fixed; right: 16px; bottom: 16px; font-size: 10px; color: var(--ink-dim); text-align: right; line-height: 1.6; z-index: 1; }

  aside {
    position: fixed; top: 64px; right: 16px; bottom: 16px; width: 380px; max-width: calc(100vw - 32px); z-index: 4;
    background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 16px;
    display: flex; flex-direction: column; overflow: hidden; transform: translateX(calc(100% + 24px)); transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 0 40px rgba(79, 243, 255, 0.08);
  }
  aside.open { transform: none; }
  aside .head { padding: 16px 18px 10px; border-bottom: 1px solid var(--glass-edge); position: relative; }
  aside .close { all: unset; cursor: pointer; position: absolute; top: 12px; right: 14px; font-size: 18px; color: var(--ink-dim); }
  aside h2 { margin: 0 0 4px; font: 700 18px var(--display); word-break: break-all; padding-right: 24px; }
  aside .group { font-size: 11px; display: inline-flex; align-items: center; gap: 6px; word-break: break-all; }
  aside .meta { font-size: 11px; color: var(--ink-dim); margin-top: 6px; line-height: 1.6; word-break: break-all; }
  aside .meta a { color: var(--dep); text-decoration: none; border-bottom: 1px dotted currentColor; }
  aside .body { overflow: auto; padding: 12px 18px 18px; flex: 1; }
  aside h3 { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); margin: 14px 0 6px; }
  aside h3 b { color: var(--ink); }
  .links { display: flex; flex-wrap: wrap; gap: 4px; }
  .links button {
    all: unset; cursor: pointer; font-size: 11px; padding: 3px 8px; border-radius: 6px;
    background: rgba(255,255,255,0.05); border: 1px solid transparent; word-break: break-all;
  }
  .links.dep button { color: var(--dep); }
  .links.user button { color: var(--user); }
  .links button:hover { border-color: currentColor; }
  .links button small { color: var(--ink-dim); margin-left: 4px; }
  .classes { font-size: 11px; color: var(--accent); line-height: 1.7; }
  .fns { font-size: 10.5px; line-height: 1.65; max-height: 220px; overflow: auto; padding: 6px 10px; border-radius: 10px; background: rgba(0,0,0,0.3); }
  .fns div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--good); }
  .fns span { color: var(--ink-dim); }
  pre {
    margin: 0; font-size: 10.5px; line-height: 1.5; padding: 10px 12px; border-radius: 10px; overflow: auto;
    background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(79, 243, 255, 0.12); color: #b9c3ff; max-height: 340px;
  }
  pre .kw { color: #ff79c6; } pre .str { color: #f1fa8c; } pre .com { color: #5e6a9e; font-style: italic; }
  pre .pp { color: #50fa7b; } pre .num { color: #ffb86c; }
  .empty { font-size: 11px; color: var(--ink-dim); }

  /* welcome / loading screen */
  .welcome {
    position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(ellipse at 50% 40%, rgba(23, 26, 82, 0.55), rgba(4, 2, 12, 0.85));
  }
  .welcome[hidden], .modal[hidden], .pop[hidden] { display: none; }
  .welcome .card {
    width: min(480px, 100%); text-align: center; padding: 30px 28px; border-radius: 20px;
    background: var(--glass-solid); border: 1px solid var(--glass-edge); box-shadow: 0 0 80px rgba(255, 95, 210, 0.12);
  }
  .welcome h2 {
    margin: 0 0 6px; font-family: Orbitron, var(--mono); font-weight: 800; font-size: 30px; letter-spacing: 0.2em;
    background: linear-gradient(90deg, #ff5fd2, #ffe14f, #4ff3ff); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .welcome .sub { margin: 0 0 20px; color: var(--ink-dim); font-size: 12px; line-height: 1.6; }
  .welcome .langs { margin-top: 16px; font-size: 10px; color: var(--ink-dim); line-height: 1.7; }
  .welcome .path { margin-top: 12px; font-size: 11px; color: var(--ink-dim); word-break: break-all; }
  .welcome .err { margin-bottom: 14px; padding: 10px 12px; border-radius: 10px; font-size: 12px; color: #ffb3bb; background: rgba(255, 95, 109, 0.1); border: 1px solid rgba(255, 95, 109, 0.35); word-break: break-word; }
  .spinner {
    width: 54px; height: 54px; margin: 6px auto 0; border-radius: 50%;
    border: 3px solid rgba(79, 243, 255, 0.15); border-top-color: var(--dep); border-right-color: var(--user);
    animation: spin 0.9s linear infinite; box-shadow: 0 0 30px rgba(79, 243, 255, 0.25);
  }

  /* folder browser (browser mode; the Mac app uses the native picker) */
  .modal { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: 24px; background: rgba(4, 2, 12, 0.7); }
  .modal .card {
    width: min(560px, 100%); max-height: min(640px, calc(100vh - 48px)); display: flex; flex-direction: column; gap: 10px;
    padding: 16px; border-radius: 16px; background: var(--glass-solid); border: 1px solid var(--glass-edge);
  }
  .modal h3 { margin: 0; font: 700 16px var(--display); }
  .crumb { font-size: 11px; color: var(--ink-dim); word-break: break-all; }
  .crumb b { color: var(--good); font-weight: 400; }
  .dirs { flex: 1; overflow: auto; min-height: 160px; border-radius: 10px; background: rgba(0,0,0,0.3); padding: 4px; }
  .dirs button { all: unset; cursor: pointer; display: flex; gap: 8px; align-items: center; width: 100%; box-sizing: border-box; padding: 6px 10px; border-radius: 6px; font-size: 12px; }
  .dirs button:hover { background: rgba(79, 243, 255, 0.1); }
  .dirs .git { margin-left: auto; font-size: 10px; color: var(--good); }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }

  #toast {
    position: fixed; top: 64px; left: 50%; transform: translate(-50%, -12px); opacity: 0; pointer-events: none; z-index: 10;
    font-size: 12px; padding: 10px 16px; border-radius: 12px; background: var(--glass-solid); border: 1px solid var(--glass-edge);
    transition: opacity 0.3s, transform 0.3s; max-width: calc(100vw - 32px); text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast small { color: var(--ink-dim); margin-left: 6px; }
  #toast .gone { margin-top: 6px; font-size: 10px; color: #ff9aa4; text-align: left; }
  /* now playing: the radio's track and its credit, faint, at the bottom centre */
  #np {
    position: fixed; bottom: 14px; left: 50%; transform: translate(-50%, 6px); opacity: 0; pointer-events: none; z-index: 4;
    font-size: 10.5px; letter-spacing: 0.04em; color: var(--ink-dim); white-space: nowrap; transition: opacity 2.5s, transform 2.5s;
  }
  #np.show { opacity: 0.75; transform: translate(-50%, 0); }
  #np b { color: #c9b8ff; font-weight: 500; }
  #tip {
    position: fixed; pointer-events: none; font-size: 11px; padding: 5px 9px; border-radius: 8px; z-index: 6;
    background: rgba(4, 2, 12, 0.85); border: 1px solid var(--glass-edge); transform: translate(12px, 12px); display: none; white-space: nowrap;
  }

  @media (max-width: 720px) {
    header { padding: 10px 16px; gap: 8px; }
    h1 { font-size: 15px; }
    .stats { display: none; }
    .search { margin-left: 0; width: 100%; order: 3; }
    .search input { width: 100%; }
    .results { width: 100%; }
    aside { top: auto; left: 16px; right: 16px; width: auto; height: 55vh; transform: translateY(calc(100% + 24px)); }
    .hint { display: none; }
    aside.open ~ .legend { display: none; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="scene"></canvas>
<div id="tip"></div>
<div id="toast"></div>
<div id="np"></div>

<header>
  <h1>CODE ROOM</h1>
  <div class="repo-wrap">
    <button class="repo" id="repoBtn" title="Open another repository (O)"><span class="rdot"></span><span id="repoName">Open repository</span><span class="caret">▾</span></button>
    <div class="pop" id="repoMenu" hidden></div>
  </div>
  <span class="stats" id="stats"></span>
  <div class="search">
    <input id="q" type="search" placeholder="Search module, class or function…" autocomplete="off" spellcheck="false">
    <div class="results" id="results"></div>
  </div>
  <div class="toolbar">
    <button class="tbtn" id="tTree" aria-pressed="false" title="Highlight the full transitive dependency tree of the selection">Tree</button>
    <button class="tbtn" id="tLabels" aria-pressed="false" title="Show all labels">Labels</button>
    <button class="tbtn" id="tPhys" aria-pressed="true" title="Strand physics (turn off to save CPU)">Physics</button>
    <button class="tbtn" id="tSpin" aria-pressed="true" title="Auto-rotate">Spin</button>
  </div>
  <div class="sliders" title="Double-click a slider to reset it">
    <label>Size <input id="sSize" type="range" min="0.25" max="1.6" step="0.05" value="1"><output id="oSize">100%</output></label>
    <label>Spread <input id="sSpread" type="range" min="0.6" max="3" step="0.05" value="1"><output id="oSpread">1.0×</output></label>
    <label title="Sound volume">Vol <input id="sVol" type="range" min="0" max="1" step="0.05" value="0.7"><output id="oVol">70%</output></label>
  </div>
  <div class="toolbar">
    <button class="tbtn update" id="tUpdate" title="Rescan the repository for changes (U)"><span class="spin">⟳</span> Update</button>
    <button class="tbtn" id="tAuto" aria-pressed="false" title="Rescan automatically every 4 seconds">Auto</button>
    <button class="tbtn" id="tSound" aria-pressed="true" title="Ambience and sound effects">♪ Sound</button>
    <button class="tbtn" id="tMusic" aria-pressed="true" title="Generative music: felt piano and distant chip tunes over the ambience">♫ Music</button>
  </div>
  <span class="stats" id="scanned"></span>
</header>

<aside id="panel">
  <div class="head">
    <button class="close" id="close" aria-label="Close">×</button>
    <h2 id="pName"></h2>
    <span class="group" id="pGroup"></span>
    <div class="meta" id="pMeta"></div>
  </div>
  <div class="body">
    <h3>Depends on <b id="pDepN"></b></h3>
    <div class="links dep" id="pDeps"></div>
    <h3>Used by <b id="pUseN"></b></h3>
    <div class="links user" id="pUsers"></div>
    <h3 id="pTreeH" hidden>Full dependency tree <b id="pTreeN"></b></h3>
    <div class="links dep" id="pTree"></div>
    <h3>Functions <b id="pFnN"></b></h3>
    <div class="fns" id="pFns"></div>
    <h3>Types</h3>
    <div class="classes" id="pClasses"></div>
    <h3 id="pFile"></h3>
    <pre id="pCode"></pre>
  </div>
</aside>

<div class="legend" id="legend"></div>
<div class="hint">size = functions &nbsp; strands = references<br>
  drag empty space · orbit &nbsp; drag bubble · shake it &nbsp; scroll · zoom<br>
  <span style="color:var(--dep)">●</span> depends on &nbsp; <span style="color:var(--user)">●</span> used by<br><span id="fps"></span></div>

<div class="welcome" id="welcome" hidden>
  <div class="card">
    <h2>CODE ROOM</h2>
    <p class="sub" id="wSub"></p>
    <div id="wBody"></div>
  </div>
</div>

<div class="modal" id="browser" hidden>
  <div class="card">
    <h3>Choose a repository</h3>
    <div class="crumb" id="bPath"></div>
    <div class="dirs" id="bDirs"></div>
    <div class="row">
      <button class="ghost" id="bUp">↑ Up</button>
      <span class="grow"></span>
      <button class="ghost" id="bCancel">Cancel</button>
      <button class="primary" id="bOpen">Open this folder</button>
    </div>
  </div>
</div>

<script src="sound.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const canvas = $("scene");
  const ctx = canvas.getContext("2d");
  // inside Code Room.app the page can ask the Mac side for a folder picker, Finder, editors
  const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.codeRoom;
  const tell = (msg) => { try { native.postMessage(msg); } catch (_) {} };
  // procedural sound (sound.js); a silent stand-in keeps the page working without it
  const SFX = window.CodeRoomSound || new Proxy({}, { get: () => () => {} });

  // ---------- state ----------
  const PALETTE = ["#ff5fd2", "#4ff3ff", "#ffe14f", "#7dff6a", "#b98bff", "#ff9a3d", "#ff5f6d", "#3da9ff",
                   "#5fffc8", "#ffb3f0", "#c6ff3d", "#ff6ad5", "#8cf0ff", "#ffd28c", "#a0a8ff"];
  let nodes = [], links = [], byId = new Map(), groups = [], groupCounts = {}, proj = [], bigNodes = new Set();
  const groupColor = {}, hiddenGroups = new Set(), anchors = {};
  let alpha = 1, T = 0, last = performance.now(), idle = 0, LS = 1;
  let selected = null, hovered = null, dragNode = null;
  let treeMode = false, allLabels = false, spin = true, physics = true;
  let treeSet = null, matchSet = null;
  let sizeScale = 1, spacing = 1; // Size slider (drawn radius) and Spread slider (distance between bubbles)
  let currentRoot = null, repoName = "", recent = [], home = "", supported = [];

  function visible(n) { return !hiddenGroups.has(n.group); }
  function hexA(hex, a) {
    const v = parseInt(hex.slice(1), 16);
    return `rgba(${v >> 16},${(v >> 8) & 255},${v & 255},${a})`;
  }
  function mixWhite(hex, t) {
    const v = parseInt(hex.slice(1), 16), m = (c) => Math.round(c + (255 - c) * t);
    return `rgb(${m(v >> 16)},${m((v >> 8) & 255)},${m(v & 255)})`;
  }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function tildify(p) { return home && p && p.startsWith(home) ? "~" + p.slice(home.length) : p; }
  function baseName(p) { return String(p).replace(/\/+$/, "").split("/").pop() || p; }
  function shortGroup(g) { const parts = g.split("/"); return parts.length > 2 ? "…/" + parts.slice(-2).join("/") : g; }

  // bubble size: functions defined in the module; declaration-only files stay small
  function radiusOf(n) {
    if (n.funcs > 0) return Math.min(58, 6 + Math.sqrt(n.funcs) * 2.6);
    return 4 + Math.min(6, Math.sqrt(n.loc) * 0.25);
  }

  // ---------- layout: 3D force simulation, clustered by folder ----------
  let CUT2 = 250000;
  function repel(a, b) {
    let dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
    const d2 = dx * dx + dy * dy + dz * dz + 0.01;
    if (d2 > CUT2) return;
    const d = Math.sqrt(d2), minD = a.r + b.r + 8;

  // ---------- lighting ----------
  // A light core lives in the cloud: it rests on the densest cluster, swings to a selected bubble and
  // takes on its colour, opens with the bloom and flares as each inward wave reaches the centre.
  // High above the room a second light throws slow god rays down through the void.
  // A wandering light circles slowly through the cloud, changing colour, and every bubble catches it
  // (and the core, the selection and the music's notes) on its rim and in a glint: lit per pixel.
  const light = { x: 0, y: 0, z: 0, sx: 0, sy: 0, r: 200, vis: false, core: 0, sky: 0, skyX: 0, skyY: 0, cr: 0.56, cg: 0.6, cb: 1, kick: 0 };

      const o3 = i * NP * 3, o = i * NP;
      let ok = true;
      for (let k = 0, j = o3; k < NP; k++, j += 3) {   // inlined project()
        const dx = SP[j] - tx, dy = SP[j + 1] - ty, dz = SP[j + 2] - tz;
        const x1 = dx * cy - dz * sy, z1 = dx * sy + dz * cy;
        const y2 = dy * cp - z1 * sp, depth = dist - (dy * sp + z1 * cp);
        if (depth < 10) { ok = false; break; }
        const s = F / depth;
        SX[o + k] = cx0 + x1 * s; SY[o + k] = cy0 - y2 * s;
      }
      if (!ok) continue;
      const cls = strandClass(l), style = STRAND_STYLE[cls], hw = style[0], bl = Math.min(l.s.bl, l.t.bl);
      if (bl <= 0.01) continue;
      if (cls === 2) { setColor("#4ff3ff", style[1] * bl); hotDep.push(i); }
      else if (cls === 3) { setColor("#ff5fd2", style[1] * bl); hotUser.push(i); }
      else setColor(l.s.color, (cls === 0 && matchSet ? 0.3 : style[1]) * bl);
      if (cls === 1) {   // dimmed background strands: a straight polyline is plenty
        for (let k = 0; k < NP - 1; k++) lineSeg(SX[o + k], SY[o + k], SX[o + k + 1], SY[o + k + 1], hw);
        continue;
      }
      // smooth curve through the rope: quadratic pieces between midpoints, 3 steps each
      let qx = SX[o], qy = SY[o];
      for (let k = 1; k < NP - 1; k++) {
        const px = SX[o + k], py = SY[o + k];
        const mx = (px + SX[o + k + 1]) / 2, my = (py + SY[o + k + 1]) / 2;
        let lx = qx, ly = qy;
        for (let s = 1; s <= STEPS; s++) {
          const t = s / STEPS, it = 1 - t;
          const x = it * it * qx + 2 * it * t * px + t * t * mx, y = it * it * qy + 2 * it * t * py + t * t * my;
          lineSeg(lx, ly, x, y, hw);
          lx = x; ly = y;
        }
        qx = mx; qy = my;
      }
      lineSeg(qx, qy, SX[o + NP - 1], SY[o + NP - 1], hw);
    }
  }

  // data pulses flowing from the importer to the imported module, along the swaying strand
  function drawPulses() {
    for (const [list, color] of [[hotDep, "#4ff3ff"], [hotUser, "#ff5fd2"]]) {
      setColor(color, 0.95);
      for (const i of list) {
        const st = strands[i], phase = (T * 0.45 + st.ph) % 1;
        // one strand per link reports when its pulse lands: that module plays a bit
        if (st.first) {
          if (st.hotAt > T - 0.1 && phase < st.lastPhase) SFX.bit(st.l.t, panOf(st.l.t));
          st.lastPhase = phase; st.hotAt = T;
        }
        const f = phase * (NP - 1), k = Math.floor(f), u = f - k, o = i * NP;
        const x = SX[o + k] + (SX[o + k + 1] - SX[o + k]) * u, y = SY[o + k] + (SY[o + k + 1] - SY[o + k]) * u;
        quad(x - 7, y - 7, x + 7, y + 7, 0, 0, 1, 1, 4);
      }
    }
  }

  // the core's light on the floor (the bubbles' own glows are lit per pixel, see the lit layer)
  function drawGlows() {
    // the core's light on the floor: a soft ellipse on the rings straight below it
    if (light.core > 0.02) {
      project(light.x, -420 * spacing * LS, light.z, tmp);
      if (tmp.vis) {
        const w = 520 * LS * spacing * tmp.s, h = w * Math.max(0.12, Math.abs(Math.sin(cam.pitch)) * 0.9);
        cr = (light.cr * 255) | 0; cg = (light.cg * 255) | 0; cb = (light.cb * 255) | 0; ca = Math.min(255, light.core * 0.5 * 255) | 0;
        quad(tmp.sx - w, tmp.sy - h, tmp.sx + w, tmp.sy + h, 0, 0, 1, 1, 4);
      }
    }
  }

  // the overlay only clears the box it drew into last frame
  let dirty = null;
  function mark(x0, y0, x1, y1) {
    if (!dirty) dirty = [x0, y0, x1, y1];
    else { dirty[0] = Math.min(dirty[0], x0); dirty[1] = Math.min(dirty[1], y0); dirty[2] = Math.max(dirty[2], x1); dirty[3] = Math.max(dirty[3], y1); }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // a floating name card at the bubble's upper right, like the movie's code labels
  function drawTag(n, p, full) {
    const R = n.r * sizeScale * p.s;
    const fs = full ? Math.max(15, Math.min(22, 12 + p.s * 6)) : Math.max(11, Math.min(16, 9 + p.s * 4));
    ctx.font = `700 ${fs}px "Chakra Petch", "JetBrains Mono", sans-serif`;
    const nameW = ctx.measureText(n.name).width;
    let chips = [];
    if (full) {
      chips = n.classes.filter((c) => c !== n.name).slice(0, 2);
      chips.push(`${n.funcs} fn`, `${n.out.length}↓ ${n.inc.length}↑`);
    }
    ctx.font = `10px "JetBrains Mono", monospace`;
    const chipW = chips.map((c) => ctx.measureText(c).width + 12);
    const rowW = chipW.reduce((a, b) => a + b + 4, -4);
    const pad = full ? 10 : 7, w = Math.max(nameW, rowW) + pad * 2, h = fs + pad * 1.4 + (chips.length ? 22 : 0);
    let x = p.sx + R * 0.7, y = p.sy - R * 0.7 - h;
    if (x + w > W - 8) x = p.sx - R * 0.7 - w;
    if (y < 70) y = p.sy + R * 0.7;
    ctx.globalAlpha = full ? 1 : 0.85 * p.a;
    mark(x - 18, y - 18, x + w + 18, y + h + 18);
    if (full) { ctx.shadowColor = n.color; ctx.shadowBlur = 14; }
    roundRect(x, y, w, h, 7);
    ctx.fillStyle = "rgba(30,12,52,0.85)"; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = hexA(n.color, full ? 0.9 : 0.55); ctx.lineWidth = full ? 1.6 : 1; ctx.stroke();
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = `700 ${fs}px "Chakra Petch", "JetBrains Mono", sans-serif`;
    ctx.fillStyle = mixWhite(n.color, 0.25);
    ctx.fillText(n.name, x + pad, y + pad * 0.7);
    if (chips.length) {
      ctx.font = `10px "JetBrains Mono", monospace`;
      let cx = x + pad; const cyy = y + pad * 0.7 + fs + 5;
      chips.forEach((c, i) => {
        roundRect(cx, cyy, chipW[i], 16, 4);
        ctx.fillStyle = "rgba(255,255,255,0.07)"; ctx.fill();
        ctx.strokeStyle = hexA(n.color, 0.45); ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = "#dfe4ff"; ctx.fillText(c, cx + 6, cyy + 3);
        cx += chipW[i] + 4;
      });
    }
    ctx.globalAlpha = 1;
  }

  function drawSmallLabel(n, p) {
    const R = n.r * sizeScale * p.s, fs = Math.max(9, Math.min(13, 9 + p.s * 3));
    ctx.font = `600 ${fs}px "JetBrains Mono", monospace`;
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.globalAlpha = Math.max(0.5, p.a);
    const tw = ctx.measureText(n.name).width;
    ctx.fillStyle = "rgba(4,2,12,0.7)";
    ctx.fillRect(p.sx - tw / 2 - 4, p.sy + R + 4, tw + 8, fs + 4);
    mark(p.sx - tw / 2 - 4, p.sy + R + 4, p.sx + tw / 2 + 4, p.sy + R + fs + 8);
    ctx.fillStyle = n.color;
    ctx.fillText(n.name, p.sx, p.sy + R + 6);
    ctx.globalAlpha = 1;
  }

  // adaptive resolution: if frames get slow, render the WebGL layer at a lower pixel ratio
  let showFps = new URLSearchParams(location.search).has("fps");
  if (showFps) window.CR_debug = { beat: (s = 1) => onBeat(s), flutter: (v = 1) => { flutter = v; }, note: (pan = 0, v = 1) => { noteLight.pan = pan; noteLight.v = v; } };
  function adaptQuality(raw) {
    if (raw > 250) return; // the window was hidden or the machine stalled
    emaMs += (Math.min(raw, 100) - emaMs) * 0.05;
    fpsFrames++; fpsMs += raw;
    if (fpsMs >= 500) {
      $("fps").textContent = showFps ? `${Math.round(fpsFrames * 1000 / fpsMs)} fps · ${glCanvas.width}×${glCanvas.height} · js ${jsMs.toFixed(1)} ms (${Object.entries(prof).map(([k, v]) => k + " " + v.toFixed(1)).join(" · ")}) · audio ${SFX.state || "off"}` : "";
      fpsFrames = 0; fpsMs = 0;
    }
    perfMs += raw;
    if (perfMs < 1500) return;
    perfMs = 0;
    if (performance.now() < settleUntil) return;     // loading a repo or resizing: hitches are expected
    const maxScale = Math.min(DPR, 2);
    if (emaMs > 26) {                                // only drop resolution if it stays slow for ~4.5 s
      goodMs = 0;
      if (++slowChecks >= 3 && glScale > 1) { glScale = 1; sizeGL(); slowChecks = 0; settle(2000); }
    } else {
      slowChecks = 0;
      if (emaMs < 19 && glScale < maxScale && (goodMs += 1500) >= 6000) { glScale = maxScale; sizeGL(); goodMs = 0; settle(2000); }
    }
  }

  let jsMs = 0;
  const prof = { tick: 0, world: 0, strands: 0, atm: 0, lines: 0, bubbles: 0, overlay: 0 };
  let profAt = 0;
  const mark2 = (k) => { if (!showFps) return; const t = performance.now(); prof[k] += (t - profAt - prof[k]) * 0.05; profAt = t; };
  function frame(now) {
    const t0 = performance.now(); profAt = t0;
    const raw = now - last;
    const dt = Math.min(0.05, raw / 1000); last = now; T += dt;
    adaptQuality(raw);
    tick(); mark2("tick");
    updateWorld(); mark2("world");
    stepStrands(); mark2("strands");
    if (dragNode) { SFX.dragMove(dragSpeed, dragStretch); dragSpeed *= 0.88; }   // the scrape fades when the hand stops

    // camera easing
    if (++fitTick % 20 === 0) updateFit();
    if (!userZoomed && !selected) goal.dist = fitDist;
    if (!selected) {                                   // glide after the crowd, softly
      const k = 1 - Math.pow(0.35, dt);
      goal.tx += (focus.x - goal.tx) * k; goal.ty += (focus.y - goal.ty) * k; goal.tz += (focus.z - goal.tz) * k;
    }
    idle += dt;
    if (spin && !dragging && idle > 1.5) cam.yaw += dt * 0.07;
    const e = 1 - Math.pow(0.02, dt);
    cam.dist += (goal.dist - cam.dist) * e;
    cam.tx += (goal.tx - cam.tx) * e; cam.ty += (goal.ty - cam.ty) * e; cam.tz += (goal.tz - cam.tz) * e;
    cy = Math.cos(cam.yaw); sy = Math.sin(cam.yaw); cp = Math.cos(cam.pitch); sp = Math.sin(cam.pitch);
    listen(dt);
    for (const n of nodes) {
      project(n.wx, n.wy, n.wz, proj[n.i]);
      const st = nodeState(n); proj[n.i].a = st[0]; proj[n.i].ring = st[1];
    }
    updateLight(dt);
    const order = nodes.filter((n) => proj[n.i].vis && proj[n.i].a > 0).sort((a, b) => proj[b.i].depth - proj[a.i].depth);

    // ---- WebGL: atmosphere, background, additive light (confetti, floor, strands, pulses), bubbles, front fog ----
    mark2("world");
    drawAtmosphere(order); mark2("atm");
    gl.disable(gl.BLEND);
    drawBackground();
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    for (const m of motes) {
      m.y += m.v; if (m.y > 700) m.y = -700;
      project(m.x * LS, m.y * LS, m.z * LS, tmp);
      if (!tmp.vis) continue;
      setColor(m.c, Math.min(0.75, tmp.s * 0.8 * LS) * (0.55 + 0.45 * Math.sin(T * 2 + m.tw)));
      const k = tmp.s * 1.6 * LS;
      quad(tmp.sx, tmp.sy, tmp.sx + m.w * k, tmp.sy + m.h * k, 0, 0, 1, 1, 5);
    }
    flush(quads);

    drawFloor();
    drawStrands();
    flush(lines); mark2("lines");
    drawPulses();
    drawGlows();
    flush(quads);

    // bubbles, back to front: dark core, wrapped code, glassy shell, then the light on it
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    texBudget = 3;
    gl.useProgram(spriteProg.p);
    gl.uniform4fv(spriteProg.loc["u_lpos[0]"], LPOS); gl.uniform4fv(spriteProg.loc["u_lcol[0]"], LCOL);
    for (const n of order) {
      const p = proj[n.i];
      const grow = Math.min(1, (T - n.born) / 1.2), pop = grow < 1 ? 1 - Math.pow(1 - grow, 3) + Math.sin(grow * Math.PI) * 0.25 : 1;
      const R = p.R = n.r * n.bs * sizeScale * p.s * (n === hovered || n === dragNode ? 1.08 : 1) * pop;
      if (R < 0.6) continue;
      const fade = p.fade = p.a * Math.max(0.3, Math.min(1, p.s * 1.4)) * Math.min(1, n.bl * 2.5);
      const x = p.sx, y = p.sy;
      setColor("#07051a", fade * 0.6);
      quad(x - R * 0.97, y - R * 0.97, x + R * 0.97, y + R * 0.97, 0, 0, 1, 1, 0);
      if (R > 9) {
        const s = codeSlot(n);
        if (s) { setColor("#ffffff", fade * 0.95); quad(x - R, y - R, x + R, y + R, s.u0, s.v0, s.u1, s.v1, s.mode); }
      }
      const c = spriteCell(n.color), h = R * (SPR / BODY) / 2;
      setColor("#ffffff", fade);
      quad(x - h, y - h, x + h, y + h, c.u0, c.v0, c.u1, c.v1, 3);
      // its own glow: selected / hovered / a neighbour of the selection / the bloom's waves / the music's ripple
      let g = n.bp * 0.6 + (n.wv || 0) * 0.45, rgb = hexRGB(n.color);
      if (n === selected) g += 0.55 + 0.1 * Math.sin(T * 3);
      else if (n === hovered) g += 0.3;
      else if (selected && p.ring) { rgb = p.ring === "#4ff3ff" ? CYAN : PINK; g += 0.28 + 0.05 * Math.sin(T * 2 + n.phase); }
      cr = Math.min(255, rgb[0] * g) | 0; cg = Math.min(255, rgb[1] * g) | 0; cb = Math.min(255, rgb[2] * g) | 0; ca = Math.min(255, fade * 255) | 0;
      const lh = R * 1.3;
      quad(x - lh, y - lh, x + lh, y + lh, 0, 0, 1, 1, 6);
    }
    flush(quads);
    drawFrontFog(); mark2("bubbles");

    // ---- 2D overlay: selection rings, change flashes and labels ----
    if (dirty) ctx.clearRect(dirty[0] - 4, dirty[1] - 4, dirty[2] - dirty[0] + 8, dirty[3] - dirty[1] + 8);
    dirty = null;
    for (const n of order) {
      const p = proj[n.i], R = p.R;
      if (!(R >= 0.6)) continue;
      if (p.ring) {
        mark(p.sx - R - 6, p.sy - R - 6, p.sx + R + 6, p.sy + R + 6);
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(T * 4);
        ctx.strokeStyle = p.ring; ctx.lineWidth = n === selected ? 2 : 1.4;
        ctx.beginPath(); ctx.arc(p.sx, p.sy, R + 4, 0, Math.PI * 2); ctx.stroke();
      }
      if (n.flash && T < n.flash.until && p.a > 0.05) {
        // expanding shock-rings mark freshly added (green) or edited (yellow) modules
        const left = (n.flash.until - T) / 6, reach = R + 32 * Math.max(0.6, p.s);
        mark(p.sx - reach, p.sy - reach, p.sx + reach, p.sy + reach);
        for (let k = 0; k < 2; k++) {
          const ph = ((T * 0.8 + k * 0.5) % 1);
          ctx.globalAlpha = (1 - ph) * left;
          ctx.strokeStyle = n.flash.color; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(p.sx, p.sy, R + 3 + ph * 26 * Math.max(0.6, p.s), 0, Math.PI * 2); ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;

    // labels: small ones for context, name cards for the biggest, full cards for the focus
    const full = new Set([selected, hovered].filter(Boolean));
    for (const n of order) {
      const p = proj[n.i];
      if (full.has(n) || p.a < 0.3 || n.bl < 1) continue;
      const neighbour = (selected && (treeMode && treeSet ? treeSet.has(n) : p.ring)) ||
                        (hovered && (hovered.outSet.has(n) || hovered.incSet.has(n))) || (matchSet && matchSet.has(n));
      if (bigNodes.has(n) && !selected && !matchSet && !hovered) drawTag(n, p, false);
      else if (allLabels || neighbour) drawSmallLabel(n, p);
    }
    for (const n of order) if (full.has(n)) drawTag(n, proj[n.i], true);

    mark2("overlay");
    jsMs += (performance.now() - t0 - jsMs) * 0.05;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- interaction ----------
  let dragging = false, down = null, moved = false, dragSpeed = 0, dragStretch = 0;
  const panOf = (n) => { const p = proj[n.i]; return p && p.vis ? Math.max(-1, Math.min(1, (p.sx / W) * 2 - 1)) : 0; };
  const pointers = new Map(); let pinch0 = 0, dist0 = 0;

  function pick(x, y) {
    let best = null, bestDepth = Infinity;
    for (const n of nodes) {
      const p = proj[n.i];
      if (!p || !p.vis || p.a < 0.05 || n.bl < 0.5) continue;
      const R = Math.max(6, n.r * n.bs * sizeScale * p.s);
      const dx = x - p.sx, dy = y - p.sy;
      if (dx * dx + dy * dy < R * R && p.depth < bestDepth) { best = n; bestDepth = p.depth; }
    }
    return best;
  }

  // move a bubble in the screen plane at its own depth (inverse of the camera rotation)
  function dragBy(n, ddx, ddy) {
    const s = (proj[n.i].s || 1) * spacing, X = ddx / s, Y = -ddy / s;
    const z1 = -sp * Y;
    n.x += cy * X + sy * z1; n.y += cp * Y; n.z += -sy * X + cy * z1;
  }

  canvas.addEventListener("pointerdown", (e) => {
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* synthetic pointers */ }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = goal.dist;
      dragNode = null;
    }
    down = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, yaw: cam.yaw, pitch: cam.pitch,
             node: pointers.size === 1 ? pick(e.clientX, e.clientY) : null };
    moved = false; dragging = true; idle = 0;
    canvas.classList.add("dragging");
  });
  canvas.addEventListener("pointermove", (e) => {
    const tip = $("tip");
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (dragging && down) {
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinch0 > 0) { goal.dist = Math.max(150, Math.min(4000 * LS, dist0 * pinch0 / d)); userZoomed = true; }
        moved = true; return;
      }
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      if (down.node && moved) {
        if (!dragNode) {
          const wires = [...down.node.outL.map((l) => [l.t, l.refs]), ...down.node.incL.map((l) => [l.s, l.refs])]
            .sort((a, b) => b[1] - a[1]).slice(0, 4).map(([w]) => ({ id: w.id, funcs: w.funcs }));
          SFX.dragStart(down.node, panOf(down.node), wires);
        }
        dragStretch = Math.min(1, Math.hypot(e.clientX - down.x, e.clientY - down.y) / 320);
        const tNow = performance.now();
        dragSpeed = Math.max(dragSpeed, Math.hypot(e.clientX - down.lx, e.clientY - down.ly) / Math.max(8, tNow - (down.lt || tNow - 16)) * 1000);
        down.lt = tNow;
        dragNode = down.node;
        alpha = Math.max(alpha, 0.06);
        dragBy(dragNode, e.clientX - down.lx, e.clientY - down.ly);
      } else if (!down.node) {
        cam.yaw = down.yaw - dx * 0.006;
        cam.pitch = Math.max(-1.3, Math.min(1.3, down.pitch + dy * 0.005));
      }
      down.lx = e.clientX; down.ly = e.clientY;
      idle = 0; tip.style.display = "none"; return;
    }
    const n = pick(e.clientX, e.clientY);
    if (n && n !== hovered) SFX.hover(n, panOf(n));
    hovered = n;
    canvas.classList.toggle("hovering", !!n);
    if (n) {
      tip.style.display = "block"; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px";
      tip.innerHTML = `<span style="color:${n.color}">●</span> ${esc(n.id)} &nbsp;<span style="color:var(--ink-dim)">${n.funcs} fn · ${n.loc} loc · ` +
        `<span style="color:var(--dep)">${n.out.length}↓</span> <span style="color:var(--user)">${n.inc.length}↑</span></span>`;
    } else tip.style.display = "none";
  });
  const end = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size > 0) return;
    canvas.classList.remove("dragging");
    if (dragging && !moved) {
      const n = pick(e.clientX, e.clientY);
      n ? select(n) : select(null);
    }
    if (dragNode) SFX.dragEnd();
    dragging = false; down = null; pinch0 = 0; dragNode = null; dragSpeed = 0; dragStretch = 0;
  };
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
  canvas.addEventListener("pointerleave", () => { if (!dragging) { hovered = null; $("tip").style.display = "none"; } });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault(); idle = 0; userZoomed = true;
    goal.dist = Math.max(150, Math.min(4000 * LS, goal.dist * Math.exp(e.deltaY * 0.0012)));
  }, { passive: false });

  // ---------- selection & panel ----------
  const KW = "class|struct|public|private|protected|virtual|override|const|static|inline|return|if|else|for|while|switch|case|break|namespace|using|typedef|enum|template|typename|void|bool|int|char|float|double|unsigned|signed|long|short|uint8_t|uint16_t|uint32_t|uint64_t|int32_t|int16_t|int8_t|nullptr|true|false|this|new|delete|operator|friend|explicit|extern|auto|import|from|export|default|function|let|var|def|self|None|True|False|package|interface|extends|implements|fn|pub|mod|use|impl|func|go|type|async|await|yield|lambda|in|is|not|and|or|val|fun|object|when|end|module|require|local|nil";
  const TOK = new RegExp(`(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/|^\\s*#(?!\\s*(?:include|import|define|if|ifdef|ifndef|endif|else|elif|pragma|undef)\\b)[^\\n]*)|("(?:[^"\\\\\\n]|\\\\.)*"|'(?:[^'\\\\\\n]|\\\\.)*')|(^\\s*#\\s*\\w+)|\\b(${KW})\\b|\\b(0x[0-9a-fA-F]+|\\d+)\\b`, "gm");
  function highlight(src) {
    return esc(src).replace(TOK, (m, com, str, pp, kw, num) =>
      com ? `<span class="com">${com}</span>` : str ? `<span class="str">${str}</span>` :
      pp ? `<span class="pp">${pp}</span>` : kw ? `<span class="kw">${kw}</span>` : `<span class="num">${num}</span>`);
  }
  function linkButtons(el, list, refsOf) {
    el.innerHTML = "";
    if (!list.length) { el.innerHTML = '<span class="empty">none</span>'; return; }
    for (const n of [...list].sort((a, b) => a.id.localeCompare(b.id))) {
      const b = document.createElement("button");
      b.innerHTML = esc(n.id) + (refsOf ? `<small>×${refsOf(n)}</small>` : "");
      b.title = refsOf ? `${refsOf(n)} references` : "";
      b.onclick = () => select(n);
      el.appendChild(b);
    }
  }

  function aimAt(n) { goal.tx = n.x * spacing; goal.ty = n.y * spacing; goal.tz = n.z * spacing; }

  function select(n, keepCamera) {
    const was = selected;
    selected = n; idle = 0;
    if (!keepCamera) {
      if (n && n !== was) {
        const deps = [...n.outL].sort((a, b) => b.refs - a.refs).map((l) => ({ n: l.t, refs: l.refs, pan: panOf(l.t) }));
        SFX.select(n, deps, panOf(n));
      } else if (!n && was) SFX.deselect();
    }
    treeSet = n ? computeTree(n) : null;
    const panel = $("panel");
    if (!n) { panel.classList.remove("open"); goal.dist = userZoomed ? Math.max(goal.dist, 850) : fitDist; return; }
    if (!keepCamera) { aimAt(n); goal.dist = Math.min(goal.dist, 420 + n.r * sizeScale * 4); }
    $("pName").textContent = n.name;
    $("pGroup").innerHTML = `<span style="color:${n.color}">●</span> ${esc(n.group)} <span style="color:var(--ink-dim)">· ${esc(n.lang || "")}</span>`;
    const fileHtml = n.files.map((f) => native ? `<a href="#" data-file="${esc(f)}" title="Open in your editor">${esc(f)}</a>` : esc(f)).join(" + ");
    $("pMeta").innerHTML = `${fileHtml} · ${n.loc.toLocaleString()} lines · ${n.funcs} functions`;
    $("pDepN").textContent = n.out.length; $("pUseN").textContent = n.inc.length;
    const outRefs = new Map(n.outL.map((l) => [l.t, l.refs])), incRefs = new Map(n.incL.map((l) => [l.s, l.refs]));
    linkButtons($("pDeps"), n.out, (d) => outRefs.get(d));
    linkButtons($("pUsers"), n.inc, (u) => incRefs.get(u));
    const treeNodes = [...treeSet.keys()].filter((x) => x !== n);
    $("pTreeH").hidden = !treeMode; $("pTree").hidden = !treeMode;
    $("pTreeN").textContent = treeNodes.length;
    if (treeMode) linkButtons($("pTree"), treeNodes);
    $("pFnN").textContent = n.funcs;
    $("pFns").innerHTML = n.functions.length
      ? n.functions.map((f) => { const i = Math.max(f.lastIndexOf("::") + 1, f.lastIndexOf(".")); return `<div>${i > 0 ? `<span>${esc(f.slice(0, i + 1))}</span>${esc(f.slice(i + 1))}` : esc(f)}</div>`; }).join("") +
        (n.funcs > n.functions.length ? `<div><span>… ${n.funcs - n.functions.length} more</span></div>` : "")
      : '<span class="empty">none (declarations only)</span>';
    $("pClasses").innerHTML = n.classes.length ? n.classes.map(esc).join(" · ") : '<span class="empty">none detected</span>';
    $("pFile").textContent = n.previewFile;
    $("pCode").innerHTML = highlight(n.preview);
    if (!keepCamera) { $("pCode").scrollTop = 0; $("pFns").scrollTop = 0; }
    panel.classList.add("open");
  }
  $("close").onclick = () => select(null);
  $("pMeta").addEventListener("click", (e) => {
    const a = e.target.closest("a[data-file]");
    if (!a) return;
    e.preventDefault();
    tell({ type: "openFile", path: currentRoot.replace(/\/+$/, "") + "/" + a.dataset.file });
  });

  // ---------- toolbar ----------
  function toggle(btn, fn) {
    btn.onclick = () => { const v = btn.getAttribute("aria-pressed") !== "true"; btn.setAttribute("aria-pressed", v); fn(v); SFX.ui(v); };
  }
  toggle($("tTree"), (v) => { treeMode = v; if (selected) select(selected, true); });
  toggle($("tLabels"), (v) => (allLabels = v));
  toggle($("tPhys"), (v) => (physics = v));
  toggle($("tSpin"), (v) => (spin = v));

  // ---------- Size / Spread sliders (remembered per browser) ----------
  function loadView() { try { return JSON.parse(localStorage.getItem("coderoom.view") || "{}"); } catch (_) { return {}; } }
  function saveView() { try { localStorage.setItem("coderoom.view", JSON.stringify({ size: sizeScale, spread: spacing })); } catch (_) {} }
  function slider(id, out, fmt, apply, initial) {
    const el = $(id);
    const set = (v) => { el.value = v; $(out).textContent = fmt(+el.value); apply(+el.value); };
    el.addEventListener("input", () => { set(el.value); saveView(); SFX.slider((el.value - el.min) / (el.max - el.min)); });
    el.addEventListener("dblclick", () => { set(1); saveView(); });
    if (initial !== undefined) set(initial);
  }
  const saved = loadView();
  slider("sSize", "oSize", (v) => Math.round(v * 100) + "%", (v) => (sizeScale = v), saved.size);
  slider("sSpread", "oSpread", (v) => v.toFixed(1) + "×", (v) => { spacing = v; if (selected) aimAt(selected); }, saved.spread);

  // ---------- sound: on/off and volume (remembered per browser) ----------
  let soundPrefs = { on: true, vol: 0.7, music: true };
  try { Object.assign(soundPrefs, JSON.parse(localStorage.getItem("coderoom.sound") || "{}")); } catch (_) {}
  const saveSound = () => { try { localStorage.setItem("coderoom.sound", JSON.stringify(soundPrefs)); } catch (_) {} };
  slider("sVol", "oVol", (v) => Math.round(v * 100) + "%", (v) => { soundPrefs.vol = v; SFX.setVolume(v); saveSound(); }, soundPrefs.vol);
  $("tSound").setAttribute("aria-pressed", soundPrefs.on);
  SFX.setVolume(soundPrefs.vol);
  SFX.setEnabled(soundPrefs.on);
  toggle($("tSound"), (v) => { soundPrefs.on = v; SFX.setEnabled(v); saveSound(); });
  $("tMusic").setAttribute("aria-pressed", soundPrefs.music);
  SFX.setMusic(soundPrefs.music);
  // the radio names what it plays (and whose it is) while it plays
  SFX.onTrack = (t) => {
    const np = $("np");
    if (!t) { np.classList.remove("show"); return; }
    np.innerHTML = `♫ <b>${esc(t.title)}</b> · ${esc(t.artist)}${t.piano ? " · on piano" : ""} · ${esc(t.license)}`;
    np.classList.add("show");
  };
  toggle($("tMusic"), (v) => { soundPrefs.music = v; SFX.setMusic(v); saveSound(); });
  // browsers only let audio start from a gesture; the Mac app allows it right away
  const wake = () => { if (soundPrefs.on) SFX.start(); };
  window.addEventListener("pointerdown", wake, true);
  window.addEventListener("keydown", wake, true);
  document.addEventListener("visibilitychange", () => SFX.setHidden(document.hidden));
  wake();
  $("tUpdate").onclick = rescan;
  let autoTimer = 0;
  toggle($("tAuto"), (v) => { clearInterval(autoTimer); if (v) autoTimer = setInterval(() => { if (!document.hidden) rescan(); }, 4000); });

  // ---------- legend ----------
  function buildLegend() {
    const legend = $("legend"); legend.innerHTML = "";
    for (const g of groups) {
      const b = document.createElement("button"); b.className = "chip"; b.title = g;
      b.innerHTML = `<span class="dot" style="background:${groupColor[g]};color:${groupColor[g]}"></span>${esc(shortGroup(g))} <small>${groupCounts[g]}</small>`;
      b.classList.toggle("off", hiddenGroups.has(g));
      b.onclick = () => {
        hiddenGroups.has(g) ? hiddenGroups.delete(g) : hiddenGroups.add(g);
        updateFit();
        SFX.ui(!hiddenGroups.has(g));
        b.classList.toggle("off", hiddenGroups.has(g));
        if (selected && hiddenGroups.has(selected.group)) select(null);
      };
      legend.appendChild(b);
    }
  }

  // ---------- search ----------
  const q = $("q"), results = $("results");
  let hits = [], active = 0;
  function renderResults() {
    results.innerHTML = "";
    hits.slice(0, 40).forEach((n, i) => {
      const b = document.createElement("button"); if (i === active) b.className = "active";
      b.innerHTML = `<span style="color:${n.color}">●</span> ${esc(n.id)} <span style="color:var(--ink-dim);margin-left:auto">${n.funcs} fn</span>`;
      b.onmousedown = (e) => { e.preventDefault(); choose(n); };
      results.appendChild(b);
    });
    results.classList.toggle("open", hits.length > 0);
  }
  function choose(n) { select(n); q.blur(); results.classList.remove("open"); matchSet = null; }
  q.addEventListener("input", () => {
    SFX.key();
    const s = q.value.trim().toLowerCase();
    if (!s) { hits = []; matchSet = null; renderResults(); return; }
    const has = (n) => n.id.toLowerCase().includes(s) || n.classes.some((c) => c.toLowerCase().includes(s)) ||
                       n.functions.some((f) => f.toLowerCase().includes(s));
    hits = nodes.filter((n) => visible(n) && has(n))
                .sort((a, b) => (a.name.toLowerCase().startsWith(s) ? 0 : 1) - (b.name.toLowerCase().startsWith(s) ? 0 : 1) || b.inc.length - a.inc.length);
    matchSet = new Set(hits); active = 0; renderResults();
  });
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { active = Math.min(hits.length - 1, active + 1); renderResults(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { active = Math.max(0, active - 1); renderResults(); e.preventDefault(); }
    else if (e.key === "Enter" && hits[active]) choose(hits[active]);
    else if (e.key === "Escape") { q.value = ""; hits = []; matchSet = null; renderResults(); q.blur(); }
  });
  q.addEventListener("blur", () => setTimeout(() => results.classList.remove("open"), 100));
  window.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("input, textarea")) return;
    if (e.key === "Escape") { $("repoMenu").hidden = true; $("browser").hidden = true; select(null); }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); q.focus(); }
    if (e.key === "u" || e.key === "U") rescan();
    if (e.key === "f" || e.key === "F") { showFps = !showFps; $("fps").textContent = ""; }
    if (e.key === "o" || e.key === "O") { e.preventDefault(); $("repoBtn").click(); }
  });

  // ---------- boot: ?root=…, else the last repository, else the welcome screen ----------
  (async () => {
    const asked = new URLSearchParams(location.search).get("root");
    const info = await refreshRecent();
    const root = asked || info.default || null;
    if (root) openRepo(root); else showWelcome("pick");
  })();
})();
</script>
</body>
</html>
